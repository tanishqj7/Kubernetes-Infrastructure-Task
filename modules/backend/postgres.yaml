apiVersion: v1
kind: Namespace
metadata:
  name: backend
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: backend
data:
  init.sql: |

    CREATE TABLE IF NOT EXISTS role (
        id SERIAL PRIMARY KEY,
        name VARCHAR(50) UNIQUE NOT NULL,
        description TEXT
    );

    CREATE TABLE IF NOT EXISTS permission (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) UNIQUE NOT NULL,
        description TEXT
    );

    CREATE TABLE IF NOT EXISTS role_permission (
        role_id INT REFERENCES role(id) ON DELETE CASCADE,
        permission_id INT REFERENCES permission(id) ON DELETE CASCADE,
        PRIMARY KEY (role_id, permission_id)
    );

    CREATE TABLE IF NOT EXISTS "user" (
        id SERIAL PRIMARY KEY,
        username VARCHAR(120) UNIQUE NOT NULL,
        password VARCHAR(255) NOT NULL,
        role_id INT REFERENCES role(id) ON DELETE CASCADE,
        namespace VARCHAR(120) DEFAULT 'backend',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS namespace (
        id SERIAL PRIMARY KEY,
        name VARCHAR(120) UNIQUE NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Insert default roles
    INSERT INTO role (name, description) VALUES
    ('AdminManager', 'Access to all namespaces with all operations'),
    ('NamespaceManager', 'Access to assigned namespace with all operations'),
    ('Viewer', 'Read-only access, limited to default namespace')
    ON CONFLICT (name) DO NOTHING;

    INSERT INTO permission (name, description) VALUES
    ('view_pod', 'View pod details'),
    ('crud_pod', 'CRUD pod'),
    ('view_job', 'View job details'),
    ('crud_job', 'CRUD job')
    ON CONFLICT (name) DO NOTHING;

    INSERT INTO role_permission (role_id, permission_id)
    SELECT r.id, p.id
    FROM role r, permission p
    WHERE r.name = 'AdminManager'
    ON CONFLICT (role_id, permission_id) DO NOTHING;

    INSERT INTO role_permission (role_id, permission_id)
    SELECT r.id, p.id
    FROM role r
    JOIN permission p ON p.name IN ('view_pod','crud_pod','view_job','crud_job')
    WHERE r.name = 'NamespaceManager'
    ON CONFLICT (role_id, permission_id) DO NOTHING;

    INSERT INTO role_permission (role_id, permission_id)
    SELECT r.id, p.id
    FROM role r
    JOIN permission p ON p.name IN ('view_pod','view_job')
    WHERE r.name = 'Viewer'
    ON CONFLICT (role_id, permission_id) DO NOTHING;

    INSERT INTO namespace (name) VALUES ('default') ON CONFLICT (name) DO NOTHING;

    INSERT INTO "user" (username, password, role_id, namespace)
    VALUES (
        'admin',
        'admin',
        (SELECT id FROM role WHERE name = 'AdminManager'),
        'platform'
    )
    ON CONFLICT (username) DO NOTHING;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: kube
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-sql
          configMap:
            name: postgres-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: backend
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

